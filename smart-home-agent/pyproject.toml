[project]
name = "smart-home-agent"
version = "0.1.0"
description = "Conversational smart home shopping agent (Google ADK + Gemini) on top of the HomePilot catalog"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "catalog-ingestion",
    "google-adk>=2.10.0",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lingua-language-detector>=2.2.0",
    "markupsafe>=3.0.3",
    "numpy>=2.5.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.1.1",
    "streamlit>=1.64.0",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "TID251"]
ignore = ["RUF001", "RUF002", "RUF003"]  # German text and typographic quotes are intentional

