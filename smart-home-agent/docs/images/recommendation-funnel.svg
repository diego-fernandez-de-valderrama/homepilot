<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="470" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- request -->
  <text x="40" y="38" font-size="13" fill="#475569"><tspan font-weight="700" fill="#0f172a">Request:</tspan> "a thermostat that works with Apple Home, under 80 euros"</text>

  <!-- funnel segments: top (40,80)->(640,160), bottom (40,340)->(640,260) -->
  <g filter="url(#shadow)">
    <polygon points="40,80 160,96 160,324 40,340" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <polygon points="160,96 280,112 280,308 160,324" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <polygon points="280,112 400,128 400,292 280,308" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <polygon points="400,128 520,144 520,276 400,292" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <polygon points="520,144 640,160 640,260 520,276" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  </g>

  <circle cx="100" cy="66" r="12" fill="#7c3aed"/><text x="100" y="71" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <circle cx="220" cy="82" r="12" fill="#2563eb"/><text x="220" y="87" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <circle cx="340" cy="98" r="12" fill="#2563eb"/><text x="340" y="103" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <circle cx="460" cy="114" r="12" fill="#16a34a"/><text x="460" y="119" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <circle cx="580" cy="130" r="12" fill="#16a34a"/><text x="580" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>

  <text x="100" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Find</text>
  <text x="100" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">candidates</text>
  <text x="100" y="230" text-anchor="middle" font-size="11.5" fill="#5b21b6">by meaning</text>
  <text x="100" y="246" text-anchor="middle" font-size="11.5" fill="#5b21b6">+ exact match</text>

  <text x="220" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Load</text>
  <text x="220" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">real data</text>
  <text x="220" y="230" text-anchor="middle" font-size="11.5" fill="#1e40af">prices, facts</text>
  <text x="220" y="246" text-anchor="middle" font-size="11.5" fill="#1e40af">from catalog</text>

  <text x="340" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Hard</text>
  <text x="340" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">filters</text>
  <text x="340" y="230" text-anchor="middle" font-size="11.5" fill="#1e40af">category,</text>
  <text x="340" y="246" text-anchor="middle" font-size="11.5" fill="#1e40af">budget, brand</text>

  <text x="460" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Compatibility</text>
  <text x="460" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">gate</text>
  <text x="460" y="230" text-anchor="middle" font-size="11.5" fill="#166534">does it work with</text>
  <text x="460" y="246" text-anchor="middle" font-size="11.5" fill="#166534">your setup?</text>

  <text x="580" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Fair</text>
  <text x="580" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">ranking</text>
  <text x="580" y="230" text-anchor="middle" font-size="11.5" fill="#166534">best fit,</text>
  <text x="580" y="246" text-anchor="middle" font-size="11.5" fill="#166534">not price</text>

  <!-- gate side exits -->
  <path d="M440,289 C430,320 400,330 392,352" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <path d="M480,284 C500,320 540,330 548,352" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
  <g filter="url(#shadow)"><rect x="300" y="356" width="170" height="62" rx="31" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/></g>
  <text x="385" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Not confirmed</text>
  <text x="385" y="400" text-anchor="middle" font-size="11" fill="#92400e">shown apart, never upsold</text>
  <g filter="url(#shadow)"><rect x="480" y="356" width="170" height="62" rx="31" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/></g>
  <text x="565" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Excluded</text>
  <text x="565" y="400" text-anchor="middle" font-size="11" fill="#475569">catalog says it won't work</text>

  <!-- results -->
  <text x="690" y="50" font-size="11" font-weight="700" letter-spacing="1.2" fill="#94a3b8">THE ANSWER</text>
  <path d="M642,210 C665,210 665,108 686,108" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M642,210 H686" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M642,210 C665,210 665,318 686,318" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)"><rect x="690" y="62" width="280" height="92" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/></g>
  <circle cx="714" cy="88" r="10" fill="#16a34a"/>
  <path d="M709,88 l4,4 l7,-8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="732" y="93" font-size="15" font-weight="700" fill="#14532d">Best match</text>
  <text x="706" y="120" font-size="12.5" fill="#166534">the product that fits the need best,</text>
  <text x="706" y="138" font-size="12.5" fill="#166534">plus the other confirmed options</text>

  <g filter="url(#shadow)"><rect x="690" y="166" width="280" height="92" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/></g>
  <path d="M714,184 l0,14 M707,191 l7,-7 l7,7" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="732" y="197" font-size="15" font-weight="700" fill="#92400e">One honest upgrade</text>
  <text x="706" y="224" font-size="12.5" fill="#78350f">only if it stays in budget, keeps every</text>
  <text x="706" y="242" font-size="12.5" fill="#78350f">feature and adds a proven one</text>

  <g filter="url(#shadow)"><rect x="690" y="270" width="280" height="92" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/></g>
  <rect x="705" y="287" width="18" height="12" rx="3" fill="none" stroke="#2563eb" stroke-width="2"/>
  <circle cx="714" cy="293" r="2" fill="#2563eb"/>
  <text x="732" y="298" font-size="15" font-weight="700" fill="#1e3a8a">Required hub</text>
  <text x="706" y="325" font-size="12.5" fill="#1e40af">when the device needs a hub you may</text>
  <text x="706" y="343" font-size="12.5" fill="#1e40af">not own, with the bundle total</text>

  <line x1="30" y1="436" x2="970" y2="436" stroke="#e2e8f0"/>
  <text x="500" y="458" text-anchor="middle" font-size="12.5" fill="#0f172a"><tspan font-weight="700">Colors, sizes and packs</tspan> of one product are listed once; the other versions keep their own status.</text>
</svg>
