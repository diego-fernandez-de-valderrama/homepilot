<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="470" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- speech bubble -->
  <g filter="url(#shadow)">
    <path d="M44,150 H206 a14,14 0 0 1 14,14 V226 a14,14 0 0 1 -14,14 H90 L66,260 L70,240 H44 a14,14 0 0 1 -14,-14 V164 a14,14 0 0 1 14,-14 z" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  </g>
  <text x="125" y="186" text-anchor="middle" font-size="14" font-weight="600" fill="#134e4a">"Does it work</text>
  <text x="125" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#134e4a">with HomeKit?"</text>
  <line x1="222" y1="195" x2="252" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- understand -->
  <g filter="url(#shadow)"><rect x="256" y="125" width="196" height="140" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/></g>
  <circle cx="280" cy="152" r="12" fill="#0f172a"/><text x="280" y="157" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="300" y="157" font-size="15" font-weight="700" fill="#0f172a">Understand</text>
  <text x="272" y="186" font-size="12.5" fill="#475569">HomeKit means Apple Home</text>
  <text x="272" y="206" font-size="12.5" fill="#475569">Siri is not HomeKit</text>
  <text x="272" y="226" font-size="12.5" fill="#475569">Google Assistant is not</text>
  <text x="272" y="244" font-size="12.5" fill="#475569">Google Home</text>

  <line x1="354" y1="267" x2="354" y2="306" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="264" y="310" width="180" height="62" rx="31" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/></g>
  <text x="354" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Unclear word?</text>
  <text x="354" y="354" text-anchor="middle" font-size="11.5" fill="#92400e">"Apple": ask which one</text>

  <line x1="454" y1="195" x2="490" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- facts -->
  <g filter="url(#shadow)">
    <path d="M494,150 V236 A70,12 0 0 0 634,236 V150" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <ellipse cx="564" cy="150" rx="70" ry="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  </g>
  <circle cx="564" cy="120" r="12" fill="#2563eb"/><text x="564" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="564" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Catalog facts</text>
  <text x="564" y="209" text-anchor="middle" font-size="11.5" fill="#1e40af">for this product,</text>
  <text x="564" y="225" text-anchor="middle" font-size="11.5" fill="#1e40af">each with its proof</text>

  <!-- verdicts -->
  <circle cx="676" cy="40" r="12" fill="#0f172a"/><text x="676" y="45" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="696" y="45" font-size="11" font-weight="700" letter-spacing="1.2" fill="#94a3b8">THE VERDICT</text>
  <path d="M636,195 C662,195 662,100 690,100" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M636,195 H690" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M636,195 C662,195 662,290 690,290" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)"><rect x="694" y="60" width="276" height="80" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/></g>
  <circle cx="716" cy="84" r="10" fill="#16a34a"/>
  <path d="M711,84 l4,4 l7,-8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="734" y="89" font-size="15" font-weight="700" fill="#14532d">Works</text>
  <text x="710" y="116" font-size="12.5" fill="#166534">the catalog confirms it, and the agent</text>
  <text x="710" y="132" font-size="12.5" fill="#166534">can show the exact text as proof</text>

  <g filter="url(#shadow)"><rect x="694" y="155" width="276" height="80" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/></g>
  <circle cx="716" cy="179" r="10" fill="#d97706"/>
  <text x="716" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">?</text>
  <text x="734" y="184" font-size="15" font-weight="700" fill="#92400e">Unknown</text>
  <text x="710" y="211" font-size="12.5" fill="#78350f">nothing is stated: the agent says it</text>
  <text x="710" y="227" font-size="12.5" fill="#78350f">cannot confirm it, never "no"</text>

  <g filter="url(#shadow)"><rect x="694" y="250" width="276" height="80" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/></g>
  <circle cx="716" cy="274" r="10" fill="#94a3b8"/>
  <path d="M712,270 l8,8 M720,270 l-8,8" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <text x="734" y="279" font-size="15" font-weight="700" fill="#334155">Does not work</text>
  <text x="710" y="306" font-size="12.5" fill="#475569">only when the catalog says so</text>
  <text x="710" y="322" font-size="12.5" fill="#475569">explicitly (very rare)</text>

  <!-- hub panel -->
  <rect x="30" y="395" width="940" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="50" y="428" font-size="13" font-weight="700" fill="#0f172a">Needs a hub?</text>
  <rect x="160" y="410" width="220" height="26" rx="13" fill="#dcfce7"/>
  <text x="270" y="428" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">you own one: all set</text>
  <rect x="395" y="410" width="260" height="26" rx="13" fill="#dbeafe"/>
  <text x="525" y="428" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">you don't: the hub is offered too</text>
  <rect x="670" y="410" width="280" height="26" rx="13" fill="#f1f5f9"/>
  <text x="810" y="428" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">not said yet: offered too, just in case</text>
</svg>
