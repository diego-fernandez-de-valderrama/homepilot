<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="540" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <g filter="url(#shadow)"><rect x="30" y="24" width="940" height="456" rx="14" fill="#ffffff" stroke="#e2e8f0"/></g>

  <!-- column headers -->
  <text x="50" y="62" font-size="11" font-weight="700" letter-spacing="1.2" fill="#94a3b8">WHAT THE AGENT DOES</text>
  <g>
    <path d="M530,44 V66 A45,7 0 0 0 620,66 V44" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
    <ellipse cx="575" cy="44" rx="45" ry="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="575" y="64" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c1d95">Qdrant</text>
  </g>
  <g>
    <path d="M680,44 V66 A55,7 0 0 0 790,66 V44" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
    <ellipse cx="735" cy="44" rx="55" ry="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="735" y="64" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">PostgreSQL</text>
  </g>
  <g>
    <path d="M845,44 V66 A55,7 0 0 0 955,66 V44" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
    <ellipse cx="900" cy="44" rx="55" ry="7" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
    <text x="900" y="64" text-anchor="middle" font-size="12.5" font-weight="700" fill="#164e63">Memory DB</text>
  </g>
  <text x="575" y="90" text-anchor="middle" font-size="10.5" fill="#7c3aed">find by meaning</text>
  <text x="735" y="90" text-anchor="middle" font-size="10.5" fill="#2563eb">catalog facts, read-only</text>
  <text x="900" y="90" text-anchor="middle" font-size="10.5" fill="#0891b2">customer facts</text>

  <!-- rows: y start 100, height 34 -->
  <g fill="#f8fafc">
    <rect x="40" y="100" width="920" height="34"/><rect x="40" y="168" width="920" height="34"/>
    <rect x="40" y="236" width="920" height="34"/><rect x="40" y="304" width="920" height="34"/>
    <rect x="40" y="372" width="920" height="34"/><rect x="40" y="440" width="920" height="34"/>
  </g>

  <g font-size="13" fill="#0f172a">
    <text x="50" y="122"><tspan font-weight="700">Open search</tspan><tspan fill="#64748b">  "something to save heating costs"</tspan></text>
    <text x="50" y="156"><tspan font-weight="700">Recommendation</tspan><tspan fill="#64748b">  "a thermostat for Apple Home"</tspan></text>
    <text x="50" y="190"><tspan font-weight="700">Exact lists</tspan><tspan fill="#64748b">  "Zigbee plugs under 30 euros"</tspan></text>
    <text x="50" y="224"><tspan font-weight="700">Product details</tspan><tspan fill="#64748b">  and other versions</tspan></text>
    <text x="50" y="258"><tspan font-weight="700">Compatibility check</tspan><tspan fill="#64748b">  "does it work with Alexa?"</tspan></text>
    <text x="50" y="292"><tspan font-weight="700">Comparison</tspan><tspan fill="#64748b">  2 to 4 products side by side</tspan></text>
    <text x="50" y="326"><tspan font-weight="700">Evidence</tspan><tspan fill="#64748b">  "how do you know?"</tspan></text>
    <text x="50" y="360"><tspan font-weight="700">Cart</tspan><tspan fill="#64748b">  names and current prices</tspan></text>
    <text x="50" y="394"><tspan font-weight="700">Product cards</tspan><tspan fill="#64748b">  in the reply</tspan></text>
    <text x="50" y="428"><tspan font-weight="700">Answer check</tspan><tspan fill="#64748b">  made-up products, false claims</tspan></text>
    <text x="50" y="462"><tspan font-weight="700">Remember the customer</tspan><tspan fill="#64748b">  "I own a Hue Bridge"</tspan></text>
  </g>

  <!-- Qdrant pills (rows 1-2) -->
  <g>
    <rect x="540" y="106" width="70" height="22" rx="11" fill="#7c3aed"/><text x="575" y="121" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">finds</text>
    <rect x="540" y="140" width="70" height="22" rx="11" fill="#7c3aed"/><text x="575" y="155" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">finds</text>
  </g>
  <!-- PostgreSQL pills (rows 1-10) -->
  <g font-size="11" font-weight="700" text-anchor="middle">
    <rect x="695" y="106" width="80" height="22" rx="11" fill="#2563eb"/><text x="735" y="121" fill="#ffffff">loads</text>
    <rect x="695" y="140" width="80" height="22" rx="11" fill="#2563eb"/><text x="735" y="155" fill="#ffffff">finds + loads</text>
    <rect x="695" y="174" width="80" height="22" rx="11" fill="#2563eb"/><text x="735" y="189" fill="#ffffff">filters</text>
    <rect x="695" y="208" width="80" height="22" rx="11" fill="#2563eb"/><text x="735" y="223" fill="#ffffff">loads</text>
    <rect x="695" y="242" width="80" height="22" rx="11" fill="#2563eb"/><text x="735" y="257" fill="#ffffff">decides</text>
    <rect x="695" y="276" width="80" height="22" rx="11" fill="#2563eb"/><text x="735" y="291" fill="#ffffff">loads</text>
    <rect x="695" y="310" width="80" height="22" rx="11" fill="#2563eb"/><text x="735" y="325" fill="#ffffff">proof</text>
    <rect x="695" y="344" width="80" height="22" rx="11" fill="#2563eb"/><text x="735" y="359" fill="#ffffff">prices</text>
    <rect x="695" y="378" width="80" height="22" rx="11" fill="#2563eb"/><text x="735" y="393" fill="#ffffff">loads</text>
    <rect x="695" y="412" width="80" height="22" rx="11" fill="#2563eb"/><text x="735" y="427" fill="#ffffff">verifies</text>
  </g>
  <!-- memory pill (row 11) -->
  <rect x="860" y="446" width="80" height="22" rx="11" fill="#0891b2"/><text x="900" y="461" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">stores</text>

  <text x="500" y="514" text-anchor="middle" font-size="13" fill="#0f172a"><tspan font-weight="700">Qdrant appears in two rows only.</tspan> Every price, verdict and proof comes from PostgreSQL.</text>
</svg>
