<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="480" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- lanes -->
  <rect x="20" y="22" width="480" height="150" rx="12" fill="#f1f5f9"/>
  <text x="36" y="44" font-size="11" font-weight="700" letter-spacing="1.2" fill="#64748b">ONCE, DURING INGEST</text>
  <rect x="20" y="288" width="480" height="150" rx="12" fill="#f0fdfa"/>
  <text x="36" y="310" font-size="11" font-weight="700" letter-spacing="1.2" fill="#0f766e">EVERY SEARCH</text>

  <!-- ingest lane -->
  <g filter="url(#shadow)"><rect x="36" y="58" width="130" height="96" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/></g>
  <text x="101" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Product</text>
  <text x="101" y="108" text-anchor="middle" font-size="11.5" fill="#475569">title, summary,</text>
  <text x="101" y="124" text-anchor="middle" font-size="11.5" fill="#475569">compatibility,</text>
  <text x="101" y="140" text-anchor="middle" font-size="11.5" fill="#475569">specs, price</text>
  <line x1="168" y1="106" x2="190" y2="106" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="194" y="58" width="150" height="96" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/></g>
  <text x="269" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Search text</text>
  <text x="269" y="108" text-anchor="middle" font-size="11.5" fill="#475569">English names next</text>
  <text x="269" y="124" text-anchor="middle" font-size="11.5" fill="#475569">to the German terms,</text>
  <text x="269" y="140" text-anchor="middle" font-size="11.5" fill="#475569">so both languages hit</text>
  <line x1="346" y1="106" x2="368" y2="106" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="372" y="58" width="116" height="96" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/></g>
  <g fill="#f59e0b"><rect x="388" y="84" width="7" height="22" rx="2"/><rect x="398" y="76" width="7" height="30" rx="2"/><rect x="408" y="92" width="7" height="14" rx="2"/><rect x="418" y="80" width="7" height="26" rx="2"/><rect x="428" y="88" width="7" height="18" rx="2"/><rect x="438" y="74" width="7" height="32" rx="2"/><rect x="448" y="94" width="7" height="12" rx="2"/><rect x="458" y="82" width="7" height="24" rx="2"/></g>
  <text x="430" y="126" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">Vector</text>
  <text x="430" y="142" text-anchor="middle" font-size="11" fill="#78350f">"document" mode</text>

  <!-- search lane -->
  <g filter="url(#shadow)">
    <path d="M48,324 H200 a12,12 0 0 1 12,12 V398 a12,12 0 0 1 -12,12 H88 L68,426 L72,410 H48 a12,12 0 0 1 -12,-12 V336 a12,12 0 0 1 12,-12 z" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  </g>
  <text x="124" y="352" text-anchor="middle" font-size="12.5" font-weight="600" fill="#134e4a">"something to keep</text>
  <text x="124" y="370" text-anchor="middle" font-size="12.5" font-weight="600" fill="#134e4a">the living room</text>
  <text x="124" y="388" text-anchor="middle" font-size="12.5" font-weight="600" fill="#134e4a">warm"</text>
  <line x1="214" y1="366" x2="250" y2="366" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="254" y="318" width="150" height="96" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/></g>
  <g fill="#f59e0b"><rect x="286" y="344" width="7" height="22" rx="2"/><rect x="296" y="336" width="7" height="30" rx="2"/><rect x="306" y="352" width="7" height="14" rx="2"/><rect x="316" y="340" width="7" height="26" rx="2"/><rect x="326" y="348" width="7" height="18" rx="2"/><rect x="336" y="334" width="7" height="32" rx="2"/><rect x="346" y="354" width="7" height="12" rx="2"/><rect x="356" y="342" width="7" height="24" rx="2"/></g>
  <text x="329" y="386" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">Vector</text>
  <text x="329" y="402" text-anchor="middle" font-size="11" fill="#78350f">"query" mode, same model</text>

  <!-- qdrant -->
  <path d="M488,106 C530,106 560,140 588,170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="532" y="120" font-size="11.5" fill="#475569">stored</text>
  <path d="M406,366 C470,366 540,340 580,300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="488" y="378" font-size="11.5" fill="#475569">nearest?</text>
  <g filter="url(#shadow)">
    <path d="M520,178 V282 A110,14 0 0 0 740,282 V178" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <ellipse cx="630" cy="178" rx="110" ry="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  </g>
  <text x="630" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">Qdrant</text>
  <text x="630" y="230" text-anchor="middle" font-size="11.5" fill="#5b21b6">one point per product</text>
  <g fill="#a78bfa"><circle cx="572" cy="254" r="4"/><circle cx="590" cy="266" r="4"/><circle cx="612" cy="250" r="4"/><circle cx="646" cy="262" r="4"/><circle cx="668" cy="248" r="4"/><circle cx="690" cy="266" r="4"/></g>
  <g fill="#7c3aed"><circle cx="628" cy="268" r="4.5"/><circle cx="640" cy="252" r="4.5"/></g>

  <!-- output -->
  <line x1="742" y1="230" x2="770" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="774" y="172" width="196" height="116" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/></g>
  <text x="790" y="198" font-size="14" font-weight="700" fill="#4c1d95">Closest (example)</text>
  <text x="790" y="220" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#5b21b6">22893310  0.81</text>
  <text x="790" y="238" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#5b21b6">23194159  0.79</text>
  <text x="790" y="256" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#5b21b6">25590063  0.77 ...</text>
  <text x="790" y="277" font-size="11" fill="#64748b">only ids and closeness</text>

  <line x1="872" y1="290" x2="872" y2="322" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <path d="M774,338 V398 A98,12 0 0 0 970,398 V338" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <ellipse cx="872" cy="338" rx="98" ry="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  </g>
  <text x="872" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">PostgreSQL</text>
  <text x="872" y="390" text-anchor="middle" font-size="11.5" fill="#1e40af">loads the real products</text>

  <line x1="20" y1="446" x2="980" y2="446" stroke="#e2e8f0"/>
  <text x="500" y="470" text-anchor="middle" font-size="13" fill="#0f172a"><tspan font-weight="700">Qdrant only answers "what is close in meaning?".</tspan> Everything the customer sees is read from PostgreSQL.</text>
</svg>
