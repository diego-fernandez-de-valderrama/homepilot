<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="450" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- customer -->
  <g filter="url(#shadow)"><rect x="30" y="185" width="120" height="100" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/></g>
  <circle cx="90" cy="215" r="11" fill="#0d9488"/>
  <path d="M72,247 a18,14 0 0 1 36,0 z" fill="#0d9488"/>
  <text x="90" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Customer</text>
  <line x1="152" y1="235" x2="186" y2="235" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- UI -->
  <g filter="url(#shadow)"><rect x="190" y="165" width="160" height="140" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/></g>
  <text x="206" y="195" font-size="15" font-weight="700" fill="#134e4a">Chat window</text>
  <text x="206" y="220" font-size="12.5" fill="#115e59">chat, product cards,</text>
  <text x="206" y="238" font-size="12.5" fill="#115e59">comparisons, cart</text>
  <text x="206" y="256" font-size="12.5" fill="#115e59">panel and confirm</text>
  <text x="206" y="274" font-size="12.5" fill="#115e59">buttons</text>
  <circle cx="336" cy="165" r="12" fill="#0f172a"/>
  <text x="336" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <line x1="352" y1="235" x2="386" y2="235" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- safety net + agent -->
  <rect x="390" y="120" width="240" height="230" rx="18" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="406" y="141" font-size="11" font-weight="700" letter-spacing="1.2" fill="#be123c">SAFETY NET</text>
  <circle cx="616" cy="120" r="12" fill="#e11d48"/>
  <text x="616" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">6</text>
  <g filter="url(#shadow)"><rect x="410" y="155" width="200" height="160" rx="14" fill="#0f172a"/></g>
  <text x="510" y="195" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">HomePilot agent</text>
  <text x="510" y="220" text-anchor="middle" font-size="12.5" fill="#cbd5e1">Gemini, guided by rules,</text>
  <text x="510" y="238" text-anchor="middle" font-size="12.5" fill="#cbd5e1">talks to the customer and</text>
  <text x="510" y="256" text-anchor="middle" font-size="12.5" fill="#cbd5e1">decides which tool to use</text>
  <rect x="455" y="275" width="110" height="22" rx="11" fill="#fbbf24"/>
  <text x="510" y="290" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350f">Gemini inside</text>
  <text x="510" y="337" text-anchor="middle" font-size="11.5" fill="#9f1239">checks every message and answer</text>
  <line x1="632" y1="235" x2="660" y2="235" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- tools -->
  <rect x="664" y="30" width="166" height="400" rx="14" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="678" y="50" font-size="11" font-weight="700" letter-spacing="1.2" fill="#94a3b8">TOOLS</text>

  <g filter="url(#shadow)"><rect x="676" y="64" width="142" height="58" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/></g>
  <circle cx="696" cy="93" r="11" fill="#7c3aed"/><text x="696" y="97.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">2</text>
  <text x="714" y="89" font-size="13" font-weight="700" fill="#0f172a">Recommend</text>
  <text x="714" y="106" font-size="11.5" fill="#475569">find the right fit</text>

  <g filter="url(#shadow)"><rect x="676" y="134" width="142" height="58" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/></g>
  <circle cx="696" cy="163" r="11" fill="#16a34a"/><text x="696" y="167.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">3</text>
  <text x="714" y="159" font-size="13" font-weight="700" fill="#0f172a">Compatibility</text>
  <text x="714" y="176" font-size="11.5" fill="#475569">does it work with...?</text>

  <g filter="url(#shadow)"><rect x="676" y="204" width="142" height="58" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/></g>
  <text x="696" y="229" font-size="13" font-weight="700" fill="#0f172a">Search, compare</text>
  <text x="696" y="246" font-size="11.5" fill="#475569">details and evidence</text>

  <g filter="url(#shadow)"><rect x="676" y="274" width="142" height="58" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/></g>
  <circle cx="696" cy="303" r="11" fill="#2563eb"/><text x="696" y="307.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">4</text>
  <text x="714" y="299" font-size="13" font-weight="700" fill="#0f172a">Cart</text>
  <text x="714" y="316" font-size="11.5" fill="#475569">add, remove, view</text>

  <g filter="url(#shadow)"><rect x="676" y="344" width="142" height="58" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/></g>
  <circle cx="696" cy="373" r="11" fill="#0891b2"/><text x="696" y="377.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">5</text>
  <text x="714" y="369" font-size="13" font-weight="700" fill="#0f172a">Remember</text>
  <text x="714" y="386" font-size="11.5" fill="#475569">the customer</text>

  <!-- stores -->
  <line x1="832" y1="105" x2="848" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <path d="M852,72 V138 A62,11 0 0 0 976,138 V72" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <ellipse cx="914" cy="72" rx="62" ry="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  </g>
  <text x="914" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Catalog</text>
  <text x="914" y="126" text-anchor="middle" font-size="11" fill="#1e40af">PostgreSQL, the truth</text>

  <line x1="832" y1="235" x2="848" y2="235" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <path d="M852,202 V268 A62,11 0 0 0 976,268 V202" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <ellipse cx="914" cy="202" rx="62" ry="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  </g>
  <text x="914" y="238" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4c1d95">Search index</text>
  <text x="914" y="256" text-anchor="middle" font-size="11" fill="#5b21b6">Qdrant, by meaning</text>

  <line x1="832" y1="365" x2="848" y2="365" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <path d="M852,332 V398 A62,11 0 0 0 976,398 V332" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <ellipse cx="914" cy="332" rx="62" ry="11" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
  </g>
  <text x="914" y="368" text-anchor="middle" font-size="13.5" font-weight="700" fill="#164e63">Memory</text>
  <text x="914" y="386" text-anchor="middle" font-size="11" fill="#155e75">facts per customer</text>

  <text x="30" y="365" font-size="12.5" font-weight="600" fill="#0f172a">Numbers match the</text>
  <text x="30" y="384" font-size="12.5" font-weight="600" fill="#0f172a">reading order of</text>
  <text x="30" y="403" font-size="12.5" fill="#475569">the flow pages.</text>
</svg>
