[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TID251"]
"src/catalog_ingestion/core/**" = ["TID251"]
"src/catalog_ingestion/vocabulary/**" = ["TID251"]
"src/catalog_ingestion/models/**" = ["TID251"]
"src/catalog_ingestion/preparation/**" = ["TID251"]
"src/catalog_ingestion/enrichment/**" = ["TID251"]
"src/catalog_ingestion/database/**" = ["TID251"]
"src/catalog_ingestion/indexing/**" = ["TID251"]
"src/catalog_ingestion/pipeline/**" = ["TID251"]
"src/catalog_ingestion/cli/**" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs running PostgreSQL (auto-skipped when unreachable)"]
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant:UserWarning"]
