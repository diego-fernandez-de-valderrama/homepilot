[project]
name = "smart-home-agent"
version = "0.1.0"
description = "Conversational smart home shopping agent (Google ADK + Gemini) on top of the HomePilot catalog"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "catalog-ingestion",
    "google-adk>=2.10.0",
    "google-genai>=2.25.0",
    "lingua-language-detector>=2.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.1.1",
    "streamlit>=1.64.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "TID251"]
ignore = ["RUF001", "RUF002", "RUF003"]  # German text and typographic quotes are intentional

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Evaluation code depends on the application, never the other way around.
"evals".msg = "`smart_home_agent` must not import the evaluation harnesses (only `evals/` and `tests/` may)"
# Models are imported from `smart_home_agent.models`; its subpackages are an internal layout.
"smart_home_agent.models.cart".msg = "import from `smart_home_agent.models` instead"
"smart_home_agent.models.comparison".msg = "import from `smart_home_agent.models` instead"
"smart_home_agent.models.compatibility".msg = "import from `smart_home_agent.models` instead"
"smart_home_agent.models.evidence".msg = "import from `smart_home_agent.models` instead"
"smart_home_agent.models.product".msg = "import from `smart_home_agent.models` instead"
"smart_home_agent.models.profile".msg = "import from `smart_home_agent.models` instead"
"smart_home_agent.models.recommendation".msg = "import from `smart_home_agent.models` instead"
"smart_home_agent.models.rich_content".msg = "import from `smart_home_agent.models` instead"
"smart_home_agent.models.search".msg = "import from `smart_home_agent.models` instead"
# Repositories are imported from `smart_home_agent.repositories`; its subpackages are an internal layout.
"smart_home_agent.repositories.catalog".msg = "import from `smart_home_agent.repositories` instead"
"smart_home_agent.repositories.profile".msg = "import from `smart_home_agent.repositories` instead"
"smart_home_agent.repositories.semantic".msg = "import from `smart_home_agent.repositories` instead"
# Services are imported from `smart_home_agent.services`; its subpackages are an internal layout.
"smart_home_agent.services.accessories".msg = "import from `smart_home_agent.services` instead"
"smart_home_agent.services.cart".msg = "import from `smart_home_agent.services` instead"
"smart_home_agent.services.comparison".msg = "import from `smart_home_agent.services` instead"
"smart_home_agent.services.compatibility".msg = "import from `smart_home_agent.services` instead"
"smart_home_agent.services.evidence".msg = "import from `smart_home_agent.services` instead"
"smart_home_agent.services.profile".msg = "import from `smart_home_agent.services` instead"
"smart_home_agent.services.recommendation".msg = "import from `smart_home_agent.services` instead"
"smart_home_agent.services.retrieval".msg = "import from `smart_home_agent.services` instead"
"smart_home_agent.services.rich_content".msg = "import from `smart_home_agent.services` instead"
"smart_home_agent.services.vocabulary".msg = "import from `smart_home_agent.services` instead"
"smart_home_agent.services.product_not_found_error".msg = "import from `smart_home_agent.services` instead"
# Tools are imported from `smart_home_agent.tools`; its subpackages are an internal layout.
"smart_home_agent.tools._base".msg = "import from `smart_home_agent.tools` instead"
"smart_home_agent.tools.cart".msg = "import from `smart_home_agent.tools` instead"
"smart_home_agent.tools.catalog".msg = "import from `smart_home_agent.tools` instead"
"smart_home_agent.tools.comparison".msg = "import from `smart_home_agent.tools` instead"
"smart_home_agent.tools.compatibility".msg = "import from `smart_home_agent.tools` instead"
"smart_home_agent.tools.evidence".msg = "import from `smart_home_agent.tools` instead"
"smart_home_agent.tools.preferences".msg = "import from `smart_home_agent.tools` instead"
"smart_home_agent.tools.profile".msg = "import from `smart_home_agent.tools` instead"
"smart_home_agent.tools.recommendation".msg = "import from `smart_home_agent.tools` instead"
"smart_home_agent.tools.threaded_function_tool".msg = "import from `smart_home_agent.tools` instead"
"smart_home_agent.tools.tool_registry".msg = "import from `smart_home_agent.tools` instead"

[tool.ruff.lint.per-file-ignores]
"evals/**" = ["TID251"]
"tests/**" = ["TID251"]
"src/smart_home_agent/models/**" = ["TID251"]
"src/smart_home_agent/repositories/**" = ["TID251"]
"src/smart_home_agent/services/**" = ["TID251"]
"src/smart_home_agent/tools/**" = ["TID251"]

[tool.ruff.lint.isort]
known-first-party = ["smart_home_agent", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # the `evals` package lives next to `src/`, outside the installed package
markers = ["integration: needs running PostgreSQL/Qdrant (auto-skipped when unreachable)"]
filterwarnings = [
    "ignore:.*EXPERIMENTAL.*JSON_SCHEMA_FOR_FUNC_DECL:UserWarning",
    "ignore:.*EXPERIMENTAL.*TOOL_CONFIRMATION:UserWarning",
]

[tool.uv.sources]
catalog-ingestion = { path = "../catalog-ingestion", editable = true }

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.deptry]
known_first_party = ["smart_home_agent", "evals", "tests"]

[tool.deptry.per_rule_ignores]
# psycopg is never imported: SQLAlchemy loads it at runtime for the `postgresql+psycopg` URL.
DEP002 = ["psycopg"]
