<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="470" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- left: sentence -> numbers -> point -->
  <g filter="url(#shadow)">
    <path d="M44,40 H356 a12,12 0 0 1 12,12 V104 a12,12 0 0 1 -12,12 H90 L70,132 L74,116 H44 a12,12 0 0 1 -12,-12 V52 a12,12 0 0 1 12,-12 z" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  </g>
  <text x="200" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#134e4a">"How do I wire the thermostat</text>
  <text x="200" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#134e4a">to 230 volts?"</text>

  <line x1="200" y1="136" x2="200" y2="164" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Gemini turns it into 768 numbers</text>
  <g fill="#f59e0b">
    <rect x="62" y="226" width="9" height="20" rx="2"/><rect x="74" y="210" width="9" height="36" rx="2"/>
    <rect x="86" y="232" width="9" height="14" rx="2"/><rect x="98" y="200" width="9" height="46" rx="2"/>
    <rect x="110" y="220" width="9" height="26" rx="2"/><rect x="122" y="236" width="9" height="10" rx="2"/>
    <rect x="134" y="214" width="9" height="32" rx="2"/><rect x="146" y="204" width="9" height="42" rx="2"/>
    <rect x="158" y="228" width="9" height="18" rx="2"/><rect x="170" y="218" width="9" height="28" rx="2"/>
    <rect x="182" y="238" width="9" height="8" rx="2"/><rect x="194" y="208" width="9" height="38" rx="2"/>
    <rect x="206" y="224" width="9" height="22" rx="2"/><rect x="218" y="212" width="9" height="34" rx="2"/>
    <rect x="230" y="234" width="9" height="12" rx="2"/><rect x="242" y="202" width="9" height="44" rx="2"/>
    <rect x="254" y="222" width="9" height="24" rx="2"/><rect x="266" y="230" width="9" height="16" rx="2"/>
    <rect x="278" y="210" width="9" height="36" rx="2"/><rect x="290" y="226" width="9" height="20" rx="2"/>
    <rect x="302" y="216" width="9" height="30" rx="2"/><rect x="314" y="236" width="9" height="10" rx="2"/>
    <rect x="326" y="206" width="9" height="40" rx="2"/>
  </g>
  <text x="344" y="240" font-size="14" font-weight="700" fill="#b45309">...</text>
  <text x="200" y="268" text-anchor="middle" font-size="11.5" fill="#78350f">the "fingerprint" of what the sentence means</text>

  <line x1="200" y1="280" x2="200" y2="308" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="40" y="312" width="320" height="84" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/></g>
  <path d="M68,336 l4.1,8.3 9.2,1.3 -6.6,6.5 1.6,9.1 -8.3,-4.3 -8.2,4.3 1.6,-9.1 -6.7,-6.5 9.2,-1.3 z" fill="#0f172a"/>
  <text x="92" y="346" font-size="14" font-weight="700" fill="#0f172a">A point on a meaning map</text>
  <text x="92" y="366" font-size="12" fill="#475569">close points = similar meaning,</text>
  <text x="92" y="383" font-size="12" fill="#475569">whatever the words or language</text>
  <line x1="362" y1="354" x2="396" y2="354" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- map -->
  <g filter="url(#shadow)"><rect x="400" y="30" width="570" height="390" rx="14" fill="#ffffff" stroke="#e2e8f0"/></g>
  <text x="416" y="50" font-size="11" font-weight="700" letter-spacing="1.2" fill="#94a3b8">THE MEANING MAP (SIMPLIFIED TO 2D)</text>

  <!-- off-topic -->
  <ellipse cx="525" cy="125" rx="90" ry="50" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="525" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Off-topic</text>
  <g fill="#94a3b8"><circle cx="480" cy="120" r="5"/><circle cx="505" cy="137" r="5"/><circle cx="535" cy="114" r="5"/><circle cx="562" cy="130" r="5"/><circle cx="518" cy="152" r="5"/><circle cx="552" cy="152" r="5"/></g>
  <text x="525" y="192" text-anchor="middle" font-size="11.5" font-style="italic" fill="#475569">"best pasta recipe?"</text>

  <!-- electrical -->
  <ellipse cx="870" cy="115" rx="78" ry="52" fill="#fff1f2" stroke="#e11d48" stroke-dasharray="4 3"/>
  <text x="870" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#9f1239">Electrical work</text>
  <g fill="#e11d48"><circle cx="838" cy="118" r="5"/><circle cx="852" cy="140" r="5"/><circle cx="878" cy="110" r="5"/><circle cx="902" cy="128" r="5"/><circle cx="880" cy="146" r="5"/></g>
  <text x="880" y="186" text-anchor="middle" font-size="11.5" font-style="italic" fill="#9f1239">"connect it to the mains"</text>

  <!-- smart home -->
  <ellipse cx="610" cy="305" rx="165" ry="80" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="4 3"/>
  <text x="610" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Smart home (incl. small talk)</text>
  <g fill="#2563eb">
    <circle cx="500" cy="300" r="5"/><circle cx="530" cy="272" r="5"/><circle cx="560" cy="322" r="5"/><circle cx="592" cy="284" r="5"/>
    <circle cx="624" cy="336" r="5"/><circle cx="656" cy="298" r="5"/><circle cx="688" cy="272" r="5"/><circle cx="712" cy="318" r="5"/>
    <circle cx="566" cy="354" r="5"/><circle cx="622" cy="262" r="5"/><circle cx="534" cy="336" r="5"/><circle cx="680" cy="350" r="5"/>
    <circle cx="740" cy="292" r="5"/><circle cx="596" cy="312" r="5"/>
  </g>
  <text x="600" y="404" text-anchor="middle" font-size="11.5" font-style="italic" fill="#1e40af">"which thermostat works with Alexa?"  "I'm Diego"</text>

  <!-- prompt tricks -->
  <ellipse cx="882" cy="318" rx="72" ry="50" fill="#f5f3ff" stroke="#7c3aed" stroke-dasharray="4 3"/>
  <text x="882" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Prompt tricks</text>
  <g fill="#7c3aed"><circle cx="856" cy="318" r="5"/><circle cx="884" cy="334" r="5"/><circle cx="906" cy="314" r="5"/><circle cx="870" cy="346" r="5"/></g>
  <text x="882" y="394" text-anchor="middle" font-size="11.5" font-style="italic" fill="#5b21b6">"ignore your rules"</text>

  <!-- the new message -->
  <line x1="800" y1="150" x2="838" y2="118" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="800" y1="150" x2="852" y2="140" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M800,138 l4.1,8.3 9.2,1.3 -6.6,6.5 1.6,9.1 -8.3,-4.3 -8.2,4.3 1.6,-9.1 -6.7,-6.5 9.2,-1.3 z" fill="#0f172a"/>
  <text x="786" y="178" text-anchor="end" font-size="12" font-weight="700" fill="#0f172a">your message:</text>
  <text x="786" y="194" text-anchor="end" font-size="12" fill="#0f172a">closest to Electrical work</text>

  <line x1="30" y1="432" x2="970" y2="432" stroke="#e2e8f0"/>
  <text x="500" y="456" text-anchor="middle" font-size="13" fill="#0f172a"><tspan font-weight="700">Each dot is one hand-written example sentence.</tspan> A new message is judged by the examples it lands closest to.</text>
</svg>
