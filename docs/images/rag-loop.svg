<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="480" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- legend -->
  <circle cx="44" cy="36" r="12" fill="#7c3aed"/><text x="44" y="41" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">R</text>
  <text x="62" y="41" font-size="12.5" fill="#0f172a"><tspan font-weight="700">Retrieve</tspan> the facts</text>
  <circle cx="194" cy="36" r="12" fill="#2563eb"/><text x="194" y="41" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">A</text>
  <text x="212" y="41" font-size="12.5" fill="#0f172a"><tspan font-weight="700">Augment</tspan> what the AI reads</text>
  <circle cx="394" cy="36" r="12" fill="#16a34a"/><text x="394" y="41" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">G</text>
  <text x="412" y="41" font-size="12.5" fill="#0f172a"><tspan font-weight="700">Generate</tspan> the answer</text>

  <!-- customer -->
  <g filter="url(#shadow)">
    <path d="M42,150 H198 a12,12 0 0 1 12,12 V230 a12,12 0 0 1 -12,12 H86 L64,260 L68,242 H42 a12,12 0 0 1 -12,-12 V162 a12,12 0 0 1 12,-12 z" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  </g>
  <text x="120" y="182" text-anchor="middle" font-size="13" font-weight="600" fill="#134e4a">"A thermostat for</text>
  <text x="120" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#134e4a">Apple Home, under</text>
  <text x="120" y="218" text-anchor="middle" font-size="13" font-weight="600" fill="#134e4a">80 euros?"</text>
  <line x1="212" y1="196" x2="252" y2="196" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- gemini -->
  <g filter="url(#shadow)"><rect x="256" y="130" width="190" height="132" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/></g>
  <text x="351" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">Gemini</text>
  <text x="351" y="184" text-anchor="middle" font-size="12" fill="#78350f">knows language,</text>
  <text x="351" y="200" text-anchor="middle" font-size="12" fill="#78350f">not the catalog</text>
  <text x="351" y="226" text-anchor="middle" font-size="12" fill="#78350f">so it asks a tool</text>
  <text x="351" y="242" text-anchor="middle" font-size="12" fill="#78350f">for the data</text>

  <!-- to tool -->
  <path d="M446,160 C480,160 480,95 506,95" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="474" y="140" font-size="11.5" fill="#475569">calls</text>

  <!-- tool -->
  <g filter="url(#shadow)"><rect x="510" y="60" width="200" height="90" rx="12" fill="#0f172a"/></g>
  <circle cx="510" cy="60" r="12" fill="#7c3aed"/><text x="510" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">R</text>
  <text x="610" y="92" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">A tool (plain code)</text>
  <text x="610" y="113" text-anchor="middle" font-size="12" fill="#cbd5e1">searches, filters, checks</text>
  <text x="610" y="130" text-anchor="middle" font-size="12" fill="#cbd5e1">compatibility, ranks</text>

  <!-- stores -->
  <path d="M712,85 H752" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <path d="M758,62 V120 A105,12 0 0 0 968,120 V62" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <ellipse cx="863" cy="62" rx="105" ry="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  </g>
  <text x="863" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Qdrant</text>
  <text x="863" y="114" text-anchor="middle" font-size="11.5" fill="#5b21b6">which products fit the meaning?</text>

  <path d="M712,125 C735,125 735,215 752,215" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <path d="M758,192 V252 A105,12 0 0 0 968,252 V192" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <ellipse cx="863" cy="192" rx="105" ry="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  </g>
  <text x="863" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">PostgreSQL</text>
  <text x="863" y="244" text-anchor="middle" font-size="11.5" fill="#1e40af">prices, facts, requirements</text>

  <!-- result -->
  <path d="M863,266 C863,330 790,360 716,360" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="874" y="298" font-size="11.5" fill="#1e40af">real rows</text>
  <g filter="url(#shadow)"><rect x="510" y="300" width="200" height="120" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/></g>
  <rect x="580" y="292" width="60" height="14" rx="4" fill="#94a3b8"/>
  <circle cx="710" cy="300" r="12" fill="#2563eb"/><text x="710" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">A</text>
  <text x="526" y="330" font-size="14" font-weight="700" fill="#1e3a8a">Tool result</text>
  <g stroke="#bfdbfe" stroke-width="6" stroke-linecap="round"><line x1="528" y1="348" x2="690" y2="348"/><line x1="528" y1="364" x2="660" y2="364"/></g>
  <text x="526" y="388" font-size="11.5" fill="#1e40af">product ids, prices, verdicts,</text>
  <text x="526" y="404" font-size="11.5" fill="#1e40af">upgrade and hub</text>
  <path d="M508,360 C470,360 440,320 410,266" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="330" text-anchor="end" font-size="11.5" fill="#1e40af">added to what</text>
  <text x="410" y="345" text-anchor="end" font-size="11.5" fill="#1e40af">Gemini reads</text>

  <!-- answer -->
  <path d="M300,264 C290,300 240,320 220,340" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="30" y="344" width="250" height="80" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/></g>
  <circle cx="30" cy="344" r="12" fill="#16a34a"/><text x="30" y="349" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">G</text>
  <text x="46" y="372" font-size="14" font-weight="700" fill="#14532d">The answer</text>
  <text x="46" y="392" font-size="12" fill="#166534">written only from the tool result,</text>
  <text x="46" y="408" font-size="12" fill="#166534">products as markers, not data</text>

  <line x1="30" y1="440" x2="970" y2="440" stroke="#e2e8f0"/>
  <text x="500" y="464" text-anchor="middle" font-size="13" fill="#0f172a"><tspan font-weight="700">Gemini never touches a database.</tspan> It only sees what a tool hands back, and may loop several times per question.</text>
</svg>
