<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="440" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- legend -->
  <text x="30" y="40" font-size="13" font-weight="700" fill="#0f172a">How far "Off-topic" beats "Smart home" for each message</text>
  <circle cx="620" cy="35" r="6" fill="#2563eb"/><text x="632" y="40" font-size="12" fill="#1e3a8a">small talk ("I'm Diego", "hmm")</text>
  <circle cx="832" cy="35" r="6" fill="#94a3b8"/><text x="844" y="40" font-size="12" fill="#334155">off-topic questions</text>

  <!-- regions (zero at x=410) -->
  <rect x="150" y="62" width="260" height="290" fill="#eff6ff" opacity="0.6"/>
  <rect x="410" y="62" width="530" height="290" fill="#f1f5f9" opacity="0.6"/>
  <line x1="410" y1="58" x2="410" y2="356" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="280" y="80" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#1d4ed8">SMART HOME WINS: PASSES</text>
  <text x="675" y="80" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#475569">OFF-TOPIC WINS</text>

  <!-- before row -->
  <g filter="url(#shadow)"><rect x="30" y="112" width="110" height="76" rx="10" fill="#ffffff" stroke="#e11d48" stroke-width="1.5"/></g>
  <text x="85" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#9f1239">Before</text>
  <text x="85" y="159" text-anchor="middle" font-size="11" fill="#9f1239">groups overlap</text>
  <text x="85" y="174" text-anchor="middle" font-size="11" fill="#9f1239">near zero</text>
  <line x1="150" y1="150" x2="940" y2="150" stroke="#cbd5e1" stroke-width="1.5"/>
  <g fill="#94a3b8"><circle cx="358" cy="142" r="6"/><circle cx="410" cy="158" r="6"/><circle cx="445" cy="143" r="6"/><circle cx="479" cy="157" r="6"/><circle cx="514" cy="144" r="6"/><circle cx="566" cy="156" r="6"/><circle cx="635" cy="145" r="6"/><circle cx="722" cy="155" r="6"/></g>
  <g fill="#2563eb"><circle cx="254" cy="150" r="6"/><circle cx="306" cy="156" r="6"/><circle cx="341" cy="160" r="6"/><circle cx="375" cy="146" r="6"/><circle cx="393" cy="158" r="6"/><circle cx="427" cy="146" r="6"/></g>
  <circle cx="462" cy="150" r="7" fill="#2563eb" stroke="#e11d48" stroke-width="2.5"/>
  <line x1="462" y1="142" x2="486" y2="112" stroke="#e11d48" stroke-width="1.2"/>
  <text x="490" y="110" font-size="11.5" font-weight="700" fill="#9f1239">"im diego": wrongly blocked</text>

  <!-- after row -->
  <g filter="url(#shadow)"><rect x="30" y="262" width="110" height="76" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/></g>
  <text x="85" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">After</text>
  <text x="85" y="309" text-anchor="middle" font-size="11" fill="#166534">clearly</text>
  <text x="85" y="324" text-anchor="middle" font-size="11" fill="#166534">separated</text>
  <line x1="150" y1="300" x2="940" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>
  <g fill="#2563eb"><circle cx="160" cy="296" r="6"/><circle cx="185" cy="306" r="6"/><circle cx="237" cy="293" r="6"/><circle cx="271" cy="307" r="6"/><circle cx="289" cy="294" r="6"/><circle cx="306" cy="306" r="6"/><circle cx="323" cy="297" r="6"/></g>
  <g fill="#94a3b8"><circle cx="358" cy="304" r="6"/><circle cx="462" cy="294" r="6"/><circle cx="514" cy="306" r="6"/><circle cx="566" cy="295" r="6"/><circle cx="618" cy="305" r="6"/><circle cx="687" cy="296" r="6"/><circle cx="774" cy="306" r="6"/><circle cx="878" cy="297" r="6"/></g>
  <circle cx="219" cy="300" r="7" fill="#2563eb" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="219" y1="308" x2="236" y2="334" stroke="#16a34a" stroke-width="1.2"/>
  <text x="240" y="342" font-size="11.5" font-weight="700" fill="#166534">"im diego": passes easily</text>

  <!-- change badge -->
  <rect x="540" y="205" width="380" height="34" rx="17" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="730" y="227" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">fix: small-talk examples + a different embedding task type</text>

  <line x1="30" y1="376" x2="970" y2="376" stroke="#e2e8f0"/>
  <text x="500" y="404" text-anchor="middle" font-size="13" fill="#0f172a"><tspan font-weight="700">Now the ranking itself keeps small talk safe;</tspan> the thresholds no longer have to guard a coin flip.</text>
  <text x="500" y="424" text-anchor="middle" font-size="11" fill="#64748b">(simplified illustration of the pattern measured on the evaluation and test messages)</text>
</svg>
