<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="440" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- column labels -->
  <circle cx="42" cy="38" r="12" fill="#0f172a"/><text x="42" y="43" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="62" y="43" font-size="11" font-weight="700" letter-spacing="1.2" fill="#94a3b8">COMPARE</text>
  <circle cx="282" cy="38" r="12" fill="#0f172a"/><text x="282" y="43" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="302" y="43" font-size="11" font-weight="700" letter-spacing="1.2" fill="#94a3b8">SCORE EACH CATEGORY</text>
  <circle cx="682" cy="38" r="12" fill="#0f172a"/><text x="682" y="43" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="702" y="43" font-size="11" font-weight="700" letter-spacing="1.2" fill="#94a3b8">DECIDE</text>

  <!-- 1 compare -->
  <g filter="url(#shadow)"><rect x="30" y="60" width="210" height="300" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
  <path d="M52,76 l4.1,8.3 9.2,1.3 -6.6,6.5 1.6,9.1 -8.3,-4.3 -8.2,4.3 1.6,-9.1 -6.7,-6.5 9.2,-1.3 z" fill="#0f172a"/>
  <text x="76" y="92" font-size="13.5" font-weight="700" fill="#0f172a">Your message</text>
  <text x="46" y="122" font-size="12" fill="#475569">is compared with every</text>
  <text x="46" y="139" font-size="12" fill="#475569">example sentence:</text>
  <rect x="46" y="158" width="14" height="14" rx="3" fill="#2563eb"/><text x="68" y="170" font-size="12.5" fill="#0f172a">Smart home</text><text x="224" y="170" text-anchor="end" font-size="12.5" font-weight="700" fill="#1e3a8a">104</text>
  <rect x="46" y="186" width="14" height="14" rx="3" fill="#e11d48"/><text x="68" y="198" font-size="12.5" fill="#0f172a">Electrical work</text><text x="224" y="198" text-anchor="end" font-size="12.5" font-weight="700" fill="#9f1239">17</text>
  <rect x="46" y="214" width="14" height="14" rx="3" fill="#94a3b8"/><text x="68" y="226" font-size="12.5" fill="#0f172a">Off-topic</text><text x="224" y="226" text-anchor="end" font-size="12.5" font-weight="700" fill="#334155">36</text>
  <rect x="46" y="242" width="14" height="14" rx="3" fill="#7c3aed"/><text x="68" y="254" font-size="12.5" fill="#0f172a">Prompt tricks</text><text x="224" y="254" text-anchor="end" font-size="12.5" font-weight="700" fill="#4c1d95">17</text>
  <line x1="46" y1="272" x2="224" y2="272" stroke="#e2e8f0"/>
  <text x="46" y="296" font-size="12" fill="#475569">Closeness is a number</text>
  <text x="46" y="313" font-size="12" fill="#475569">from 0 (unrelated) to</text>
  <text x="46" y="330" font-size="12" fill="#475569">1 (same meaning).</text>
  <line x1="242" y1="210" x2="268" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 bars -->
  <g filter="url(#shadow)"><rect x="272" y="60" width="380" height="300" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
  <text x="288" y="88" font-size="13.5" font-weight="700" fill="#0f172a">Average of the 2 closest examples</text>
  <text x="288" y="106" font-size="11.5" fill="#64748b">example: "How do I wire the thermostat to 230 volts?"</text>

  <!-- scale: 0.5 -> x 400, 0.9 -> x 620 (550 px per 1.0) -->
  <g font-size="10.5" fill="#94a3b8" text-anchor="middle">
    <text x="400" y="330">0.5</text><text x="455" y="330">0.6</text><text x="510" y="330">0.7</text><text x="565" y="330">0.8</text><text x="620" y="330">0.9</text>
  </g>
  <g stroke="#f1f5f9"><line x1="455" y1="126" x2="455" y2="316"/><line x1="510" y1="126" x2="510" y2="316"/><line x1="565" y1="126" x2="565" y2="316"/><line x1="620" y1="126" x2="620" y2="316"/></g>

  <text x="390" y="152" text-anchor="end" font-size="12.5" font-weight="700" fill="#9f1239">Electrical</text>
  <rect x="400" y="137" width="187" height="22" rx="5" fill="#e11d48"/>
  <text x="593" y="153" font-size="12" font-weight="700" fill="#9f1239">0.84</text>
  <line x1="554" y1="130" x2="554" y2="166" stroke="#0f172a" stroke-width="2.5"/>
  <text x="554" y="126" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">bar 0.78</text>

  <text x="390" y="200" text-anchor="end" font-size="12.5" font-weight="700" fill="#1e3a8a">Smart home</text>
  <rect x="400" y="185" width="116" height="22" rx="5" fill="#2563eb"/>
  <text x="522" y="201" font-size="12" font-weight="700" fill="#1e3a8a">0.71</text>

  <text x="390" y="248" text-anchor="end" font-size="12.5" font-weight="700" fill="#4c1d95">Prompt tricks</text>
  <rect x="400" y="233" width="66" height="22" rx="5" fill="#7c3aed"/>
  <text x="472" y="249" font-size="12" font-weight="700" fill="#4c1d95">0.62</text>

  <text x="390" y="296" text-anchor="end" font-size="12.5" font-weight="700" fill="#334155">Off-topic</text>
  <rect x="400" y="281" width="44" height="22" rx="5" fill="#94a3b8"/>
  <text x="450" y="297" font-size="12" font-weight="700" fill="#334155">0.58</text>

  <path d="M628,148 h8 v48 h-8" fill="none" stroke="#16a34a" stroke-width="1.8"/>
  <text x="640" y="170" font-size="11" font-weight="700" fill="#15803d">clear</text>
  <text x="640" y="184" font-size="11" font-weight="700" fill="#15803d">lead</text>
  <line x1="654" y1="210" x2="678" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 decide -->
  <g filter="url(#shadow)"><rect x="682" y="60" width="288" height="300" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
  <text x="698" y="88" font-size="13.5" font-weight="700" fill="#0f172a">Blocked only if all three hold:</text>

  <circle cx="710" cy="118" r="10" fill="#16a34a"/><path d="M705,118 l4,4 l7,-8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="728" y="116" font-size="12.5" fill="#0f172a">the winner is Electrical work</text>
  <text x="728" y="133" font-size="12.5" fill="#0f172a">or Prompt tricks</text>
  <circle cx="710" cy="162" r="10" fill="#16a34a"/><path d="M705,162 l4,4 l7,-8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="728" y="160" font-size="12.5" fill="#0f172a">its score clears that</text>
  <text x="728" y="177" font-size="12.5" fill="#0f172a">category's bar</text>
  <circle cx="710" cy="206" r="10" fill="#16a34a"/><path d="M705,206 l4,4 l7,-8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="728" y="204" font-size="12.5" fill="#0f172a">it leads the runner-up</text>
  <text x="728" y="221" font-size="12.5" fill="#0f172a">by a clear margin</text>

  <rect x="698" y="244" width="256" height="44" rx="22" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="826" y="271" text-anchor="middle" font-size="13" font-weight="700" fill="#9f1239">Blocked: fixed safe reply</text>
  <rect x="698" y="298" width="256" height="44" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="826" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Otherwise: goes to the agent</text>

  <line x1="30" y1="384" x2="970" y2="384" stroke="#e2e8f0"/>
  <text x="500" y="414" text-anchor="middle" font-size="13" fill="#0f172a"><tspan font-weight="700">One embedding call and about 170 quick comparisons</tspan> per message: milliseconds, and no second AI to fool.</text>
</svg>
