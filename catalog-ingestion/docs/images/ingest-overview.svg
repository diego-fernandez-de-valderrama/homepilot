<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="420" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- input file -->
  <g filter="url(#shadow)">
    <path d="M30,95 H105 L130,120 V225 H30 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M105,95 V120 H130" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <text x="80" y="160" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">products</text>
  <text x="80" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">.zip</text>
  <text x="80" y="205" text-anchor="middle" font-size="11.5" fill="#64748b">one JSON</text>
  <text x="80" y="219" text-anchor="middle" font-size="11.5" fill="#64748b">per product</text>
  <line x1="132" y1="160" x2="166" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 1 -->
  <g filter="url(#shadow)"><rect x="170" y="70" width="170" height="180" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/></g>
  <rect x="170" y="70" width="170" height="6" rx="3" fill="#0d9488"/>
  <circle cx="198" cy="104" r="14" fill="#0d9488"/>
  <text x="198" y="109" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="220" y="109" font-size="16" font-weight="700" fill="#0f172a">Prepare</text>
  <text x="186" y="148" font-size="12.5" fill="#475569">Opens every product,</text>
  <text x="186" y="167" font-size="12.5" fill="#475569">cleans price, brand</text>
  <text x="186" y="186" font-size="12.5" fill="#475569">and category, and</text>
  <text x="186" y="205" font-size="12.5" fill="#475569">notes what is missing.</text>
  <line x1="342" y1="160" x2="376" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <g filter="url(#shadow)"><rect x="380" y="70" width="170" height="180" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/></g>
  <rect x="380" y="70" width="170" height="6" rx="3" fill="#d97706"/>
  <circle cx="408" cy="104" r="14" fill="#d97706"/>
  <text x="408" y="109" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="430" y="109" font-size="16" font-weight="700" fill="#0f172a">Enrich</text>
  <text x="396" y="148" font-size="12.5" fill="#475569">Fills gaps from the</text>
  <text x="396" y="167" font-size="12.5" fill="#475569">product page and AI,</text>
  <text x="396" y="186" font-size="12.5" fill="#475569">then fact-checks</text>
  <text x="396" y="205" font-size="12.5" fill="#475569">every claim.</text>
  <line x1="552" y1="160" x2="586" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 3 -->
  <g filter="url(#shadow)"><rect x="590" y="70" width="170" height="180" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/></g>
  <rect x="590" y="70" width="170" height="6" rx="3" fill="#2563eb"/>
  <circle cx="618" cy="104" r="14" fill="#2563eb"/>
  <text x="618" y="109" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="640" y="109" font-size="16" font-weight="700" fill="#0f172a">Store</text>
  <text x="606" y="148" font-size="12.5" fill="#475569">Saves the verified</text>
  <text x="606" y="167" font-size="12.5" fill="#475569">product, its facts</text>
  <text x="606" y="186" font-size="12.5" fill="#475569">and where each fact</text>
  <text x="606" y="205" font-size="12.5" fill="#475569">came from.</text>
  <line x1="762" y1="160" x2="796" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 4 -->
  <g filter="url(#shadow)"><rect x="800" y="70" width="170" height="180" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/></g>
  <rect x="800" y="70" width="170" height="6" rx="3" fill="#7c3aed"/>
  <circle cx="828" cy="104" r="14" fill="#7c3aed"/>
  <text x="828" y="109" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <text x="850" y="109" font-size="16" font-weight="700" fill="#0f172a">Index</text>
  <text x="816" y="148" font-size="12.5" fill="#475569">Writes a searchable</text>
  <text x="816" y="167" font-size="12.5" fill="#475569">description, turns it</text>
  <text x="816" y="186" font-size="12.5" fill="#475569">into a vector and</text>
  <text x="816" y="205" font-size="12.5" fill="#475569">stores it for search.</text>

  <!-- helpers and stores -->
  <line x1="465" y1="252" x2="465" y2="296" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="395" y="300" width="140" height="70" rx="35" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/></g>
  <text x="465" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Gemini</text>
  <text x="465" y="350" text-anchor="middle" font-size="11.5" fill="#92400e">AI helper</text>

  <line x1="675" y1="252" x2="675" y2="294" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <path d="M605,312 V368 A70,12 0 0 0 745,368 V312" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <ellipse cx="675" cy="312" rx="70" ry="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  </g>
  <text x="675" y="347" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">PostgreSQL</text>
  <text x="675" y="365" text-anchor="middle" font-size="11.5" fill="#1e3a8a">source of truth</text>

  <line x1="885" y1="252" x2="885" y2="294" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <path d="M815,312 V368 A70,12 0 0 0 955,368 V312" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <ellipse cx="885" cy="312" rx="70" ry="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  </g>
  <text x="885" y="347" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Qdrant</text>
  <text x="885" y="365" text-anchor="middle" font-size="11.5" fill="#4c1d95">search index</text>

  <text x="30" y="330" font-size="12.5" font-weight="600" fill="#0f172a">Unchanged products are</text>
  <text x="30" y="349" font-size="12.5" font-weight="600" fill="#0f172a">skipped at every step,</text>
  <text x="30" y="368" font-size="12.5" fill="#475569">so running it again only</text>
  <text x="30" y="387" font-size="12.5" fill="#475569">does the new work.</text>
</svg>
